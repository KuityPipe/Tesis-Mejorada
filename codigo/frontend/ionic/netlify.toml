# Config de Netlify para el demo desplegado (docs/PLAN_PORTAFOLIO.md,
# Nivel 2.2). El backend va aparte, en Render (ver render.yaml en la raíz
# del repo).
#
# Cómo usarlo: en el dashboard de Netlify, "Add new site" → "Import an
# existing project" → conectar este repo, con "Base directory" =
# codigo/frontend/ionic (Netlify detecta este archivo solo una vez ahí).

[build]
  command = "npm run build"
  publish = "www"
  # SIN comando `ignore` a propósito (2026-10-13). Antes había
  # `git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF .` para saltar los builds que no tocaban el frontend, pero
  # devolvía "sin cambios" aun habiendo cambios y Netlify canceló todos los builds ("Canceled build due to no
  # content change"): el sitio quedó congelado en una versión vieja sin ningún error visible. Construir en cada
  # push cuesta algo más de minutos de build, pero es mejor que publicar un frontend desactualizado sin enterarse.

# Angular es una SPA con ruteo del lado del cliente (app-routing.module.ts)
# — sin esto, recargar la página en cualquier ruta que no sea "/" (ej.
# /catalogo/3) da 404, porque Netlify busca un archivo real en esa ruta en
# vez de dejar que Angular la resuelva.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad para todo el sitio. Sin CSP completa a propósito: la app incrusta mapas (OpenStreetMap, Google),
# usa Google Fonts y habla con la API en otro dominio; una CSP estricta se prueba aparte para no romper nada.
# `frame-ancestors 'none'` evita que otro sitio meta KeyServ en un iframe (clickjacking).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(), payment=()"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
