<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>KeyServ</title>

  <script>
    // Aplica el tema guardado ANTES de pintar la página (evita el flash de
    // tema incorrecto) — mismo criterio y misma clave semántica que el
    // <script> de base.html en el sitio Django (allá usa
    // data-bs-theme/localStorage 'ks-theme'; acá el atributo es
    // data-theme, que es el que leen los bloques [data-theme="dark"]/
    // :not([data-theme="light"]) de src/theme/variables.scss). Sin
    // sesión o con localStorage bloqueado (modo privado), respeta la
    // preferencia del SO y no hace nada — variables.scss ya cubre ese
    // caso con @media (prefers-color-scheme: dark).
    (function () {
      try {
        var guardado = localStorage.getItem('ks-theme');
        if (guardado === 'light' || guardado === 'dark') {
          document.documentElement.setAttribute('data-theme', guardado);
        }
      } catch (e) { /* localStorage bloqueado: queda la preferencia del SO */ }
    })();
  </script>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
