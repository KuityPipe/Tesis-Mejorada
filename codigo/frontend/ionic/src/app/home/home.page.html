<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>KeyServ</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="salir()">Cerrar sesión</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div *ngIf="cargando">Cargando…</div>

  <ion-list *ngIf="usuario">
    <ion-item lines="none">
      <ion-label>
        <h1>{{ usuario.nombre_usuario }} {{ usuario.apellido_usuario }}</h1>
        <p>{{ usuario.email }}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Proveedor</ion-label>
      <ion-badge [color]="usuario.es_proveedor ? 'success' : 'medium'" slot="end">
        {{ usuario.es_proveedor ? 'Sí' : 'No' }}
      </ion-badge>
    </ion-item>
    <ion-item lines="none">
      <ion-label>Verificado biométricamente</ion-label>
      <ion-badge [color]="usuario.verificado_biometricamente ? 'success' : 'medium'" slot="end">
        {{ usuario.verificado_biometricamente ? 'Sí' : 'No' }}
      </ion-badge>
    </ion-item>
  </ion-list>
</ion-content>
