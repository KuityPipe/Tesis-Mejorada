<ion-header [translucent]="true">
  <ion-toolbar>
    <img src="assets/logo.png" alt="KeyServ" slot="start" class="ks-toolbar-logo">
    <ion-title>Mis publicaciones</ion-title>
    <app-top-nav slot="end"></app-top-nav>
    <app-tema-toggle slot="end"></app-tema-toggle>
    <app-account-menu slot="end"></app-account-menu>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding ks-content-wide ks-fondo-foto" style="--ks-fondo-foto: url(assets/fotos/carpinteria.jpg)">
  <div class="ks-page-header">
    <h1><ion-icon name="albums-outline"></ion-icon> Mis publicaciones</h1>
    <p>Lo que ofreces en KeyServ: revisa su estado y publica uno nuevo cuando quieras.</p>
  </div>

  <app-skeleton *ngIf="cargando" variante="card" [cantidad]="4"></app-skeleton>

  <ng-container *ngIf="!cargando">
    <!-- Mismo grid .ks-card-grid que usa la sección "Mis publicaciones" de perfil.html en Django (con el badge de estado, a diferencia del catálogo público). -->
    <div class="ks-card-grid" *ngIf="publicaciones.length">
      <a class="ks-card-tile" *ngFor="let publicacion of publicaciones; let i = index" [routerLink]="['/catalogo', publicacion.id_publicacion]" appReveal [appRevealDelay]="(i % 12) * 50">
        <div class="ks-card-tile-img">
          <img *ngIf="publicacion.imagen_portada; else sinImagen" [src]="publicacion.imagen_portada" [alt]="publicacion.titulo" />
          <ng-template #sinImagen>
            <div class="ks-card-tile-img-placeholder"><ion-icon name="construct-outline"></ion-icon></div>
          </ng-template>
          <ion-badge [color]="colorEstado(publicacion.estado_moderacion)" style="position:absolute; top:8px; right:8px;">
            {{ publicacion.estado_moderacion_display }}
          </ion-badge>
        </div>
        <div class="ks-card-tile-body">
          <h3>{{ publicacion.titulo }}</h3>
          <div class="ks-card-tile-footer">
            <span *ngIf="publicacion.precio">${{ publicacion.precio | number }}</span>
          </div>
        </div>
      </a>
    </div>

    <app-empty-state
      *ngIf="!publicaciones.length"
      icono="megaphone-outline"
      titulo="Todavía no publicaste ningún servicio"
      mensaje="Publica tu primer servicio para que los clientes puedan encontrarte."
    ></app-empty-state>

    <ion-button expand="block" fill="outline" class="ion-margin-top" routerLink="/catalogo/crear">
      <ion-icon name="add-outline" slot="start"></ion-icon> Publicar un nuevo servicio
    </ion-button>
  </ng-container>
</ion-content>
