<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Resultado del pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
    <p>Consultando el estado del pago con Khipu…</p>
  </div>

  <ng-container *ngIf="!cargando">
    <div class="ks-resultado-pago" appReveal>
      <div class="ks-resultado-pago-icon" [class.ks-ok]="aprobado" [class.ks-pendiente]="!aprobado">
        <ion-icon [name]="aprobado ? 'checkmark-circle' : 'time-outline'"></ion-icon>
      </div>
      <ion-text [color]="aprobado ? 'success' : 'medium'">
        <p>{{ mensaje }}</p>
      </ion-text>
      <ion-button expand="block" (click)="volver()">Volver a la contratación</ion-button>
    </div>
  </ng-container>
</ion-content>
