<!-- Un solo botón que abre/cierra los 4 links en un popover, en cualquier
ancho de pantalla — no solo en móvil. La primera versión mostraba la fila
horizontal completa en escritorio y el menú solo aparecía por debajo de
768px, pero con el título de la página y el menú de cuenta compartiendo
el mismo renglón (pedido explícito del usuario: layout de 3 columnas
logo/título/accesos), la fila de 4 links de más competía por espacio y
truncaba el título ("usa el espacio de manera inteligente" — feedback en
vivo). `ion-popover` con `trigger` se posiciona solo (sin números mágicos
de altura de toolbar) y ya se usa con el mismo patrón en
AccountMenuComponent. -->
<!-- En pantallas anchas (>= 992px) los 4 links van en línea y llenan el header; en celular/tablet angosta queda solo el botón de menú. -->
<nav class="ks-nav-inline" aria-label="Navegación principal">
  <a routerLink="/" routerLinkActive="ks-nav-active" [routerLinkActiveOptions]="{ exact: true }" (click)="ir()">Inicio</a>
  <a routerLink="/catalogo" routerLinkActive="ks-nav-active">Servicios</a>
  <a routerLink="/calculadora" routerLinkActive="ks-nav-active">Calculadora</a>
  <a routerLink="/" fragment="acerca" (click)="ir('acerca')">Acerca de nosotros</a>
  <a routerLink="/" fragment="contacto" (click)="ir('contacto')">Contacto</a>
</nav>
<ion-buttons class="ks-nav-burger">
  <ion-button [id]="idTrigger" aria-label="Abrir menú de navegación">
    <ion-icon slot="icon-only" name="menu-outline"></ion-icon>
  </ion-button>
</ion-buttons>
<ion-popover [trigger]="idTrigger" [dismissOnSelect]="true" side="bottom" alignment="start" size="fixed">
  <ng-template>
    <ion-content>
      <ion-list lines="full">
        <ion-item button routerLink="/" routerLinkActive="ks-nav-active" [routerLinkActiveOptions]="{ exact: true }" detail="false" (click)="ir()">
          <ion-icon name="home-outline" slot="start"></ion-icon>
          <ion-label>Inicio</ion-label>
        </ion-item>
        <ion-item button routerLink="/catalogo" routerLinkActive="ks-nav-active" detail="false">
          <ion-icon name="grid-outline" slot="start"></ion-icon>
          <ion-label>Servicios</ion-label>
        </ion-item>
        <ion-item button routerLink="/calculadora" routerLinkActive="ks-nav-active" detail="false">
          <ion-icon name="calculator-outline" slot="start"></ion-icon>
          <ion-label>Calculadora</ion-label>
        </ion-item>
        <ion-item button routerLink="/" fragment="acerca" detail="false" (click)="ir('acerca')">
          <ion-icon name="information-circle-outline" slot="start"></ion-icon>
          <ion-label>Acerca de nosotros</ion-label>
        </ion-item>
        <ion-item button routerLink="/" fragment="contacto" detail="false" lines="none" (click)="ir('contacto')">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-label>Contacto</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-popover>
