<!--
  Componentes con prefijo `ion-` (ion-header, ion-toolbar, ion-input...) son
  Web Components de Ionic: se ven distinto en iOS vs Android/web
  automáticamente (mismo HTML, look nativo de cada plataforma), sin código
  propio para eso.
-->
<ion-header [translucent]="true">
  <ion-toolbar>
    <img src="assets/logo.png" alt="KeyServ" slot="start" class="ks-toolbar-logo">
    <ion-title>Iniciar sesión</ion-title>
    <app-top-nav slot="end"></app-top-nav>
    <app-account-menu slot="end"></app-account-menu>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding ks-content-narrow">
  <!--
    [formGroup] conecta este <form> con el `formulario` armado en
    login.page.ts (Reactive Forms) — a diferencia de Django, donde el
    <form> del template y la clase Form en views.py son dos cosas separadas
    que solo se relacionan por el POST, acá el HTML queda enlazado en vivo
    al estado de la clase. (ngSubmit) captura el submit del form (Enter en
    un campo, o el botón) y llama a enviar() en la clase.
  -->
  <form [formGroup]="formulario" (ngSubmit)="enviar()" class="ion-margin-top">
    <ion-card appReveal>
      <ion-card-content>
        <!-- Mismo h1+subtítulo centrado que .ks-panel en sesion.html del sitio Django (el título del toolbar de arriba no reemplaza este encabezado dentro del panel). -->
        <div class="ion-text-center ion-margin-bottom">
          <h1>Iniciar sesión</h1>
          <p>Ingresa a tu cuenta de KeyServ.</p>
        </div>

        <ion-list lines="none">
          <ion-item>
            <!-- formControlName ata este <ion-input> al control "email" del formulario — value y validación quedan sincronizados solos, sin (input)/[value] manuales. -->
            <ion-input
              label="Correo electrónico"
              labelPlacement="floating"
              type="email"
              formControlName="email"
              autocomplete="email"
            ></ion-input>
          </ion-item>
          <ion-item>
            <ion-input
              label="Contraseña"
              labelPlacement="floating"
              type="password"
              formControlName="password"
              autocomplete="current-password"
            ></ion-input>
          </ion-item>
        </ion-list>

        <!-- *ngIf es una directiva estructural: si errorMensaje es null/vacío, este <ion-text> ni se agrega al DOM (no es solo display:none). -->
        <ion-text color="danger" *ngIf="errorMensaje">
          <p class="ion-padding-start">{{ errorMensaje }}</p>
        </ion-text>

        <!-- [disabled] con binding de propiedad (corchetes) evalúa la expresión de TS; {{ }} interpola el texto según el estado `enviando` mientras se espera la respuesta del backend. -->
        <ion-button
          expand="block"
          class="ion-margin-top"
          type="submit"
          [disabled]="formulario.invalid || enviando"
        >
          {{ enviando ? 'Ingresando…' : 'Iniciar sesión' }}
        </ion-button>
      </ion-card-content>
    </ion-card>
    <ion-button expand="block" fill="clear" routerLink="/registro">¿No tienes cuenta? Regístrate</ion-button>
    <ion-button expand="block" fill="clear" routerLink="/recuperar">¿Olvidaste tu contraseña?</ion-button>
    <ion-button expand="block" fill="clear" routerLink="/">&larr; Volver al inicio</ion-button>
  </form>

  <app-footer></app-footer>
</ion-content>
