<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Mis contrataciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding ks-content-wide">
  <!-- Mismo encabezado que .ks-page-header en reservas.html del sitio Django. -->
  <div class="ks-page-header">
    <h1><ion-icon name="calendar-outline"></ion-icon> Mis contrataciones</h1>
    <p>Solicitudes, confirmaciones y servicios completados.</p>
  </div>

  <app-skeleton *ngIf="cargando" variante="card" [cantidad]="4"></app-skeleton>

  <ng-container *ngIf="!cargando && contrataciones.length">
    <!-- Mismo .ks-reservas-toolbar que reservas.html: busqueda + rango de fechas, filtrado en memoria (reservas_view tampoco filtra del lado del servidor). -->
    <div class="ks-reservas-toolbar">
      <div class="ks-filter-field ks-filter-field-buscar">
        <label for="reservas-buscar"><ion-icon name="search-outline"></ion-icon> Buscar</label>
        <input type="text" id="reservas-buscar" placeholder="Servicio o persona..." [(ngModel)]="busqueda" (ngModelChange)="aplicarFiltros()">
      </div>
      <div class="ks-filter-field">
        <label for="reservas-desde"><ion-icon name="calendar-outline"></ion-icon> Desde</label>
        <input type="date" id="reservas-desde" [(ngModel)]="desde" (ngModelChange)="aplicarFiltros()">
      </div>
      <div class="ks-filter-field">
        <label for="reservas-hasta"><ion-icon name="calendar-outline"></ion-icon> Hasta</label>
        <input type="date" id="reservas-hasta" [(ngModel)]="hasta" (ngModelChange)="aplicarFiltros()">
      </div>
      <ion-button fill="outline" size="small" (click)="limpiarFiltros()">Limpiar filtros</ion-button>
    </div>

    <div class="ks-filtros-chips">
      <button
        type="button"
        class="ks-filtro-chip"
        *ngFor="let f of estadosFiltro"
        [class.is-activo]="filtroEstado === f.valor"
        (click)="elegirFiltro(f.valor)"
      >
        {{ f.etiqueta }} <span class="ks-filtro-count">{{ contador(f.valor) }}</span>
      </button>
    </div>

    <app-empty-state
      *ngIf="!filtradas.length"
      icono="filter-outline"
      titulo="Ningún resultado con esos filtros"
      mensaje="Prueba limpiando la búsqueda o el rango de fechas."
    ></app-empty-state>

    <!-- Mismo .ks-reservas-grid que reservas.html: foto de portada, badge de estado superpuesto, etiqueta de rol (Contraté / Me contrataron), y la acción según estado+rol. -->
    <div class="ks-reservas-grid" *ngIf="filtradas.length">
      <div class="ks-reserva-card" *ngFor="let c of filtradas; let i = index" appReveal [appRevealDelay]="(i % 12) * 50">
        <a class="ks-reserva-card-img" [routerLink]="['/contratacion', c.id_contratacion]">
          <img *ngIf="c.publicacion_imagen; else sinImagen" [src]="c.publicacion_imagen" [alt]="c.publicacion_titulo" />
          <ng-template #sinImagen>
            <div class="ks-card-tile-img-placeholder"><ion-icon name="construct-outline"></ion-icon></div>
          </ng-template>
          <ion-badge class="ks-reserva-badge" [color]="colorEstado(c.estado)">{{ etiquetaEstado(c.estado) }}</ion-badge>
        </a>
        <div class="ks-reserva-card-body">
          <span class="ks-reserva-role-tag">
            <ion-icon [name]="esCliente(c) ? 'bag-check-outline' : 'briefcase-outline'"></ion-icon>
            {{ esCliente(c) ? 'Contraté' : 'Me contrataron' }}
          </span>
          <h4><a [routerLink]="['/contratacion', c.id_contratacion]">{{ c.publicacion_titulo }}</a></h4>
          <p class="ks-reserva-counterpart">
            <ion-icon name="person-circle-outline"></ion-icon>
            {{ contraparteNombre(c) }}
          </p>

          <div class="ks-reserva-actions">
            <ng-container *ngIf="c.estado === 'COMPLETADA' && esCliente(c); else verDetalle">
              <ion-button *ngIf="!c.tiene_valoracion" [routerLink]="['/contratacion', c.id_contratacion]" fill="outline" size="small">
                <ion-icon name="star-outline" slot="start"></ion-icon> Calificar
              </ion-button>
              <a *ngIf="c.tiene_valoracion" [routerLink]="['/contratacion', c.id_contratacion]" class="ks-help">
                <ion-icon name="checkmark-circle-outline"></ion-icon> Ya calificaste este trabajo
              </a>
            </ng-container>
            <ng-template #verDetalle>
              <ion-button [routerLink]="['/contratacion', c.id_contratacion]" fill="outline" size="small">Ver detalle</ion-button>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <app-empty-state
    *ngIf="!cargando && !contrataciones.length"
    icono="calendar-outline"
    titulo="Todavía no tienes contrataciones"
    mensaje="Cuando solicites o recibas un trabajo, va a aparecer acá."
    ctaTexto="Explorar catálogo"
    ctaLink="/catalogo"
  ></app-empty-state>
</ion-content>
