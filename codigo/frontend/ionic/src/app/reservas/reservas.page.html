<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Mis contrataciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>

  <ion-list *ngIf="!cargando">
    <ion-item *ngFor="let c of contrataciones" [routerLink]="['/contratacion', c.id_contratacion]" button detail>
      <ion-thumbnail slot="start" *ngIf="c.publicacion_imagen">
        <img [src]="c.publicacion_imagen" [alt]="c.publicacion_titulo" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ c.publicacion_titulo }}</h2>
        <p>Cliente: {{ c.cliente_nombre }} · Proveedor: {{ c.proveedor_nombre }}</p>
        <p *ngIf="c.monto_acordado">${{ c.monto_acordado | number }}</p>
      </ion-label>
      <ion-badge slot="end" [color]="colorEstado(c.estado)">{{ c.estado }}</ion-badge>
    </ion-item>
    <ion-item *ngIf="!contrataciones.length" lines="none">
      <ion-label color="medium">Todavía no tenés contrataciones.</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
