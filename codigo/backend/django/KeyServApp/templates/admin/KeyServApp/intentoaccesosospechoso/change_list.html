{% extends "admin/change_list.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
  /* Toda esta lista es, por definición, material de seguridad — a
     diferencia de las selecciones de estado (que solo marcan urgencia
     puntual), acá cada fila entera lleva el mismo borde de severidad que
     usa el widget de dashboard equivalente (.ks-severity-row). */
  #result_list tbody tr td:first-child,
  #result_list tbody tr th:first-child {
    border-left: 4px solid var(--ks-coral);
  }
</style>
{% endblock %}

{% block content %}
{{ block.super }}
<p class="help" style="margin: 12px 0;">
  Geolocalización aproximada por IP —
  <a href="https://db-ip.com" target="_blank" rel="noopener">IP Geolocation by DB-IP</a>
  (base local, licencia CC-BY 4.0; ver <code>KeyServApp/geolocalizacion.py</code>).
</p>
{% endblock %}
