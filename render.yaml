# Blueprint de Render para el demo desplegado de KeyServ (docs/PLAN_PORTAFOLIO.md,
# Nivel 2.2). Levanta el backend Django (la base Postgres es externa, en
# Neon, ver DATABASE_URL) — el frontend Ionic va aparte, en Netlify (build estático, ver
# codigo/frontend/ionic/netlify.toml).
#
# Cómo usarlo: en el dashboard de Render, "New" → "Blueprint" → conectar
# este repo. Render lee este archivo solo, arma ambos servicios y pide
# completar las variables marcadas `sync: false` (ver más abajo cuáles).
#
# Alcance del demo (decisión ya tomada, ver plan): catálogo público + cuenta/
# login + contrataciones + pagos Webpay (sandbox de integración, sin cuenta
# real). Sin biometría nativa ni reconocimiento facial — ver
# requirements-render.txt para por qué esas dependencias ni se instalan acá.
services:
  - type: web
    name: keyserv-api
    runtime: python
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "cd codigo/backend/django && gunicorn KeyServProject.wsgi:application --bind 0.0.0.0:$PORT"
    # Sin esto, cualquier commit (un cambio en docs/, en el frontend Ionic,
    # en el propio README) dispara un rebuild completo acá — migrate +
    # collectstatic + sembrar_datos_demo tardan ~50s por las puras, y varios
    # pushes seguidos terminan cancelándose entre sí. `render.yaml` mismo
    # siempre gatilla un deploy sea cual sea este filtro (comportamiento de
    # Render, no hace falta listarlo a mano acá).
    buildFilter:
      paths:
        - codigo/backend/django/**
        - requirements-render.txt
        - render_build.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      # Base externa (Neon, Postgres gratuito sin vencimiento): la gratuita de
      # Render expira a los ~30 días. Pegar a mano la cadena de conexión de
      # Neon (postgresql://...?sslmode=require). Ver docs/ESTADO_Y_PROXIMOS_PASOS.md.
      - key: DATABASE_URL
        sync: false
      # Completar a mano una vez que exista la URL real del sitio en
      # Netlify (ej. https://keyserv-demo.netlify.app) — ver el paso a paso
      # del despliegue. Sin esto, el login/registro/recuperación de
      # contraseña del frontend van a fallar por CORS.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: IONIC_FRONTEND_URL
        sync: false
      # Webpay funciona sin completar nada más (usa las credenciales
      # públicas de integración del propio SDK) — ver pagos.py.
      - key: TRANSBANK_ENVIRONMENT
        value: integracion
      # Khipu no tiene sandbox público — sin KHIPU_API_KEY, pagar por Khipu
      # falla con un mensaje claro en vez de un 500 (ver pagos.py). No hace
      # falta completarlo para el demo.
      # Flow y Mercado Pago sí tienen sandbox: completar a mano en Render las claves
      # de PRUEBA (FLOW_API_KEY, FLOW_SECRET_KEY, MERCADOPAGO_ACCESS_TOKEN) para
      # que la app los ofrezca como medios de pago; sin ellas no aparecen.
      - key: FLOW_API_KEY
        sync: false
      - key: FLOW_SECRET_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: GEOIP_HABILITADO
        value: "False"
