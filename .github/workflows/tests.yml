name: Tests

on:
  push:
    branches: [master, api-ionic-migration]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keyserv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: keyserv
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://localhost:8100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # requirements-ci.txt es un subconjunto deliberado de requirements.txt
      # — ver el comentario en ese archivo (evita instalar dlib-bin/opencv/
      # transbank-sdk, que los tests no ejercitan de verdad porque están
      # mockeados o detrás de imports perezosos).
      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run Django test suite
        working-directory: codigo/backend/django
        run: python manage.py test KeyServApp

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo/frontend/ionic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: codigo/frontend/ionic/package-lock.json

      - run: npm ci

      - name: Run Angular/Ionic test suite
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

  # Tests E2E (Playwright) contra la app real (Ionic servida + API Django real con Postgres +
  # datos demo sembrados) — a diferencia de los jobs de arriba, acá no se mockea HttpClient ni la
  # base de datos, es el mismo flujo que clickearía una persona real. Job separado (no parte de
  # `frontend`) porque necesita el backend real corriendo, no solo `ng test`.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keyserv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: keyserv
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://localhost:8100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: pip install -r requirements-ci.txt

      - name: Migrate + cargar catálogos + sembrar datos demo
        working-directory: codigo/backend/django
        run: |
          python manage.py migrate
          python manage.py loaddata catalogos_iniciales
          python manage.py sembrar_datos_demo

      - name: Levantar el backend en segundo plano
        working-directory: codigo/backend/django
        run: nohup python manage.py runserver 8000 > django.log 2>&1 &

      - name: Esperar a que el backend responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/schema/ > /dev/null && exit 0
            sleep 1
          done
          echo "El backend no respondió a tiempo — log:"; cat codigo/backend/django/django.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: codigo/frontend/ionic/package-lock.json

      - name: Install frontend dependencies
        working-directory: codigo/frontend/ionic
        run: npm ci

      - name: Install Playwright (solo Chromium)
        working-directory: codigo/frontend/ionic
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: codigo/frontend/ionic
        run: npx playwright test

      - name: Subir el reporte de Playwright si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: codigo/frontend/ionic/playwright-report/
          retention-days: 7
