name: Tests

on:
  push:
    branches: [master, api-ionic-migration]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keyserv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: keyserv
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://localhost:8100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # requirements-ci.txt es un subconjunto deliberado de requirements.txt
      # — ver el comentario en ese archivo (evita instalar dlib-bin/opencv/
      # transbank-sdk, que los tests no ejercitan de verdad porque están
      # mockeados o detrás de imports perezosos).
      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run Django test suite
        working-directory: codigo/backend/django
        run: python manage.py test KeyServApp

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo/frontend/ionic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: codigo/frontend/ionic/package-lock.json

      - run: npm ci

      - name: Run Angular/Ionic test suite
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
